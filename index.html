    .cardedit .in textarea { grid-column: 1 / -1; }
    .small { font-size: 0.9rem; color: var(--muted); }
    .avatars { display: flex; gap: 8px; flex-wrap: wrap; }
    .avatar { width: 52px; height: 52px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; }

    @media (max-width: 520px) { .choice { font-size: 1.1rem; min-height: 72px; gap: 12px; padding: 12px 14px; } .say { width: 50px; } }

    U.sid = null; U.task = null; U.block = null; U.unlocked = false; U.free = false; U.pinLater = false;

      html += '<div class="tiles">' + S.students.map(function (st) {
        return '<button class="tile" data-a="pick" data-id="' + esc(st.id) + '">' + svg(st.icon) + "<span>" + esc(st.name) + "</span></button>";
      }).join("") + "</div>";
    }
    /* second mode : aller droit au blocage, sans vignette ni tâche ; rien n'est enregistré sauf rattachement à un élève */
    html += '<div class="choices">' + choice("free", {}, "Juste un coup de main", "buoy", "Sans suivi : rien n’est enregistré.") + "</div>";
    show(html, { gear: true, who: false });
  }
  function startFree() {
    U.free = true; U.sid = null; U.task = null;
    newBlock(null);
    /* la question de l'adulte se pose ici, une fois, pas au troisième « non » */
    U.pending = { start: true };
    screenAsk("adult");
  }
  function newBlock(t) {
    var at = now();
    var b = { id: uid("b"), tid: t ? t.id : null, sid: t ? t.sid : null, at: at, t: t ? at - t.start : null, adult: t && (t.adult === true || t.adult === false) ? t.adult : null, extra: false, type: null, family: null, answers: [], line: null, level: null, unfolded: false, tries: [], help: false, end: null, resumedAt: null, teacher: {} };
    if (t) S.blocks.push(b);

    return b;
  }
  /* code facultatif de l'élève : évite d'ouvrir le carnet d'un camarade ; le code de l'enseignante ouvre aussi */
  function screenStudentCode(sid) {
    var st = student(sid); U.codeFor = sid;
    show(title("Ton code") + '<label class="field"><span>' + esc(st.name) + '</span><input type="password" id="scode" autocomplete="off" maxlength="20"></label>' +
      '<p class="note" id="scerr" hidden>Ce n’est pas le bon code.</p>' +
      '<button class="big" data-a="codeOk">' + svg("play") + "Ouvrir</button>" +
      '<div class="foot"><button class="link" data-a="home">' + svg("back") + "Retour</button><span></span></div>", { who: false });
    var el = document.getElementById("scode"); if (el) el.focus();
  }
  function pickStudent(sid) {
    U.sid = sid; draft.step = 1;
    var t = openTask(sid);
    /* une tâche restée ouverte depuis moins de 3 heures peut être reprise ; plus ancienne, elle est classée abandonnée */
    if (t && now() - t.start > 3 * 3600 * 1000) { closeTask(t, "abandonnee"); save(); t = null; }
    if (t) {
      show(title("Tu avais une tâche en cours.") +
        '<div class="choices">' + choice("resume", {}, "Je la reprends", "play") + choice("newTask", {}, "Nouvelle tâche", "more") + "</div>" + footHome());
    } else screenTask();

  function footHome() {
    return '<div class="foot"><button class="link" data-a="home">' + svg("back") + 'Changer d’élève</button><button class="link" data-a="notebook">' + svg("notebook") + "Mon carnet</button></div>";
  }
  var draft = { type: null, subject: "", adult: null, step: 1 };
  function adultChips(action, cur, why) {
    return '<p class="sub">Un adulte peut t’aider ?</p><div class="chips">' + [[true, "1", "Oui"], [false, "0", "Non"]].map(function (x) {
      return '<button class="chip' + (cur === x[0] ? " sel" : "") + '" data-a="' + action + '" data-id="' + x[1] + '" aria-pressed="' + (cur === x[0]) + '">' + x[2] + "</button>";
    }).join("") + "</div>" + (why ? '<p class="hint">' + why + "</p>" : "");
  }
  function lastAdult(sid) {
    for (var i = S.tasks.length - 1; i >= 0; i--) if (S.tasks[i].sid === sid && (S.tasks[i].adult === true || S.tasks[i].adult === false)) return S.tasks[i].adult;
    return null;
  }
  /* Deux écrans : ce que je fais (tâche, matière), puis où je suis et si un adulte peut aider (déjà rempli comme la dernière fois). */
  function screenTask() {
    if (draft.step === 2 && draft.type) return screenWhere();
    draft.step = 1;
    var html = title("Tu fais quoi ?") + '<div class="tiles">' + TASK_TYPES.map(function (t) {
      return '<button class="tile' + (draft.type === t.id ? " sel" : "") + '" data-a="type" data-id="' + t.id + '" aria-pressed="' + (draft.type === t.id) + '">' + svg(t.icon) + "<span>" + esc(t.label) + "</span></button>";
    }).join("") + "</div>" +
      '<p class="sub">Matière :</p><div class="chips">' + SUBJECTS.map(function (s) {
        return '<button class="chip' + (draft.subject === s ? " sel" : "") + '" data-a="subject" data-id="' + esc(s) + '" aria-pressed="' + (draft.subject === s) + '">' + esc(s) + "</button>";
      }).join("") + "</div>" +
      '<button class="big" data-a="next"' + (draft.type ? "" : " disabled") + ">" + svg("play") + "Suite</button>" +
      (draft.type ? "" : '<p class="hint">Choisis d’abord ce que tu fais.</p>') + footHome();
    show(html);
  }
  function screenWhere() {
    var place = S.settings.place || "classe";
    show(title("Tu es où ?") + '<div class="chips">' + [["classe", "En classe"], ["maison", "À la maison"]].map(function (x) {
      return '<button class="chip' + (place === x[0] ? " sel" : "") + '" data-a="place" data-id="' + x[0] + '" aria-pressed="' + (place === x[0]) + '">' + x[1] + "</button>";
    }).join("") + "</div>" + adultChips("adult", draft.adult, "Pour choisir une aide qui te convient.") +
      '<button class="big" data-a="start">' + svg("play") + "Je commence</button>" +
      '<div class="foot">' + prevLink("prevTask") + "</div>");
  }
  var draftPlan = [];
  function startTask() {
    if (!draft.type) return;
    var old = openTask(U.sid), st = student(U.sid); if (old) closeTask(old, "abandonnee");
    U.task = { id: uid("t"), sid: U.sid, type: draft.type, subject: draft.subject, place: S.settings.place || "classe", adult: draft.adult, start: now(), end: null, status: null, plan: [], planHelped: null };
    S.tasks.push(U.task); save();
    draft = { type: null, subject: "", adult: null, step: 1 }; draftPlan = []; U.planAll = false;
    if (st && st.plan && planIds(U.sid, U.task).length) screenPlan(); else screenWork();
  }
  /* Stratégies proposées dans le plan d'attaque : celles du domaine de la tâche, connues de l'élève. */
  function planIds(sid, t) {
    var doms = t.type === "reviser" ? ["reviser"] : (t.subject === "Maths" ? ["maths"] : (t.subject === "Langues" ? ["langues"] : ["fr"]));
    var extra = t.type !== "reviser" && (t.subject === "Maths" || t.subject === "Langues") ? ["M01", "M02"] : [];
    return METHODS.filter(function (m) {
      return m.id !== "M13" && (doms.indexOf(m.dom) >= 0 || extra.indexOf(m.id) >= 0) && methodState(m.id, sid) > 0;
    }).map(function (m) { return m.id; });
  }
  /* « Mon plan d'attaque » (stratégie 13) au démarrage : facultatif, activé par élève dans l'espace enseignante. */
  /* Stratégies montrées d'abord, selon la tâche et la matière (quatre au plus) ; le reste derrière « Voir toutes ». */
  function planFirst(t) {
    if (t.type === "reviser") return ["R05", "R01", "R03", "R06"];
    if (t.subject === "Maths") return ["M01", "X01", "X02", "X07"];
    if (t.subject === "Langues") return t.type === "ecrire" ? ["M01", "L04", "L05", "L01"] : (t.type === "lire" ? ["L01", "L02", "M01", "M02"] : ["M01", "L01", "L02", "L04"]);
    if (t.type === "lire") return ["M03", "M05", "M06", "M07"];
    if (t.type === "ecrire") return ["M09", "M10", "M11", "M12"];
    return ["M01", "M02", "M07", "M04"];
  }
  function screenPlan() {
    var all = planIds(U.sid, U.task), first = planFirst(U.task).filter(function (id) { return all.indexOf(id) >= 0; }), ids;
    all.forEach(function (id) { if (first.length < 4 && first.indexOf(id) < 0) first.push(id); });
    ids = U.planAll ? first.concat(all.filter(function (id) { return first.indexOf(id) < 0; })) : first;
    show('<div class="qrow"><h1>Mon plan d’attaque</h1>' +
      sayBtn("Mon plan d’attaque. Quelles stratégies vas-tu utiliser ? " + ids.map(function (id) { return card(id).title; }).join(". "), true) + "</div>" +
      '<p class="sub">Regarde ta tâche. Quelles stratégies vas-tu utiliser ?</p><div class="plan-grid">' +
      ids.map(function (id) {
        var c = card(id), on = draftPlan.indexOf(id) >= 0;
        return '<button class="plan-item' + (on ? " sel" : "") + '" data-a="planToggle" data-id="' + id + '" aria-pressed="' + on + '">' + (c.num ? '<span class="num">' + esc(c.num) + "</span>" : "") + "<span>" + esc(c.title) + "</span></button>";
      }).join("") + '</div><button class="big" data-a="planGo">' + svg("play") + "C’est parti</button>" +
      '<div class="foot">' + (all.length > ids.length ? '<button class="link" data-a="planAll">' + svg("more") + "Voir toutes mes stratégies</button>" : "<span></span>") +
      '<button class="link" data-a="planGo" data-skip="1">Sans plan cette fois</button></div>');
  }
  function screenViewMethod(id) {
    var c = card(id), t = U.task; if (!c || !t) return;
    t.viewed = t.viewed || []; t.viewed.push(id); save();
    show(title(c.num ? "Stratégie " + c.num : "Ma stratégie") + cardHtml(c, 2, "full") +
      '<div class="foot"><button class="link" data-a="work">' + svg("back") + "Retour à ma tâche</button></div>");
  }
  /* « Avant de rendre » : courte vérification avant de clore une tâche terminée, activable par élève. */
  function screenCheck() {
    var t = U.task, items = ["J’ai répondu à toutes les questions.", "J’ai relu la consigne."];
    items.push(t.subject === "Maths" ? "J’ai mis les unités." : (t.type === "ecrire" ? "J’ai relu avec une clé de relecture." : "Mon travail est lisible."));
    show(title("Avant de rendre") + '<div class="choices">' + items.map(function (x) {
      return '<div class="choice-row"><button class="choice" data-a="checkToggle" aria-pressed="false">' + svg("check") + "<span>" + esc(x) + "</span></button>" + sayBtn(x) + "</div>";
    }).join("") + '</div><button class="big" data-a="checkOk">' + svg("check") + "C’est vérifié</button>" +
      '<div class="foot"><button class="link" data-a="work">' + svg("back") + "Je corrige encore</button></div>");
  }
  function screenWork(msg) {
    U.block = null; U.line = null; U.checkDone = false;
    var t = U.task, tt = byId(TASK_TYPES, t.type) || TASK_TYPES[4];
    show((msg ? '<p class="recall">' + esc(msg) + "</p>" : "") +
      '<div class="taskline">' + svg(tt.icon) + "<span>" + esc(tt.label) + (t.subject ? " · " + esc(t.subject) : "") + "</span>" +
      (S.settings.chrono ? '<span class="chrono" id="chrono" aria-hidden="true"></span>' : "") + "</div>" +
      '<h1 class="sr-only">Je travaille</h1>' +
      '<button class="big" data-a="blocked">' + svg("buoy") + "Je suis bloqué</button>" +
      '<div class="row"><button class="btn" data-a="finish">' + svg("check") + "J’ai fini</button></div>" +
      adultChips("adultWork", t.adult === true || t.adult === false ? t.adult : null) +
      (t.plan && t.plan.length ? '<p class="sub">Mon plan :</p><div class="chips">' + t.plan.map(function (id) {
        var c = card(id); return c ? '<button class="chip" data-a="planTry" data-id="' + id + '">' + (c.num ? esc(c.num) + " · " : "") + esc(c.title) + "</button>" : "";
      }).join("") + "</div>" : ""), { center: true });
    if (S.settings.chrono) {
      var el = document.getElementById("chrono");
      var tick = function () { if (el) el.textContent = fmtClock(now() - t.start); };
      tick(); ticker = setInterval(tick, 1000);
    }
  }
  function blocked() {
    var t = U.task, at = now();
    var recent = taskBlocks(t.id).filter(function (b) { return b.end !== "annule" && at - b.at < 10 * 60 * 1000; });
    var b = newBlock(t); save();
    /* garde-fou 1 : plus de trois blocages en dix minutes, on passe la main à un adulte */
    if (recent.length >= 3) { b.family = "garde"; b.guard = "repetes"; return goHelp(); }
    /* garde-fou 2 : blocage dans les trente premières secondes, deux tâches de suite, on trie avec trois questions */
    if (b.t < 30000 && earlyBefore(t)) { b.guard = "immediat"; return pickFamily("F5"); }
    screenFamilies();
  }
  function earlyBefore(t) {
    var prev = null;
    for (var i = S.tasks.length - 1; i >= 0; i--) if (S.tasks[i].sid === t.sid && S.tasks[i].id !== t.id) { prev = S.tasks[i]; break; }
    if (!prev) return false;
    var bs = taskBlocks(prev.id);
    return bs.length > 0 && bs[0].t < 30000;
  }
  function screenFamilies() {
    var b = U.block, attach = U.free && !b.sid && S.students.length;
    show(title("Où ça coince ?") + '<div class="choices">' + FAMILIES.map(function (f) {
      return choice("family", { id: f.id }, famLabel(f.id), f.icon);
    }).join("") + "</div>" +
      '<div class="choices apart">' + choice("family", { id: "F0" }, famLabel("F0"), "storm", null, "calm") + "</div>" +
      '<div class="foot">' + backLink() + "</div>" +
      (attach ? '<div class="foot"><button class="link" data-a="attach">' + svg("notebook") + "Enregistrer pour un élève</button></div>" : ""));
  }
  function screenAttach() {
    show(title("C’est pour qui ?") + '<div class="tiles">' + S.students.map(function (st) {
      return '<button class="tile" data-a="attachPick" data-id="' + esc(st.id) + '">' + svg(st.icon) + "<span>" + esc(st.name) + "</span></button>";
    }).join("") + '</div><div class="foot"><button class="link" data-a="families">' + svg("back") + "Retour</button></div>");
  }
  /* Question de contexte posée en route (matière, tâche ou lieu), seulement quand elle change la stratégie. */
  function screenAsk(key) {
    var opts, q;
    if (key === "subject") { q = "C’est en quelle matière ?"; opts = SUBJECTS.map(function (x) { return [x, x, null]; }); }
    else if (key === "type") { q = "C’est pour quelle tâche ?"; opts = TASK_TYPES.map(function (t) { return [t.id, t.label, t.icon]; }); }
    else if (key === "adult") { q = "Un adulte peut t’aider ?"; opts = [["1", "Oui", "people"], ["0", "Non", "cross"]]; }
    else { q = "Tu es où ?"; opts = [["classe", "En classe", "book"], ["maison", "À la maison", "home"]]; }
    U.askKey = key;
    var cheer = key === "adult" && U.block && nonCount(U.block) >= 2 ? cheerHtml("Tu as bien essayé. On cherche de l’aide.") : "";
    show(title(q) + cheer + '<div class="tiles">' + opts.map(function (o) {
      return '<button class="tile" data-a="ctxPick" data-id="' + esc(o[0]) + '">' + (o[2] ? svg(o[2]) : "") + "<span>" + esc(o[1]) + "</span></button>";
    }).join("") + "</div>" + backToTask());
  }
  function pickFamily(fid) {
    var b = U.block, st = student(b.sid);
    if (FAMILY_SUBJECT[fid] && !context(b).subject) { U.pending = { family: fid }; return screenAsk("subject"); }
    b.family = fid;
    if (fid === "F0") { b.level = 1; b.line = "F0"; U.line = { fam: "F0", seq: CALM_TOOLS.map(function (x) { return x[0]; }) }; save(); return screenCalm(); }
    var level = (fid === "F5" || !st) ? 1 : (st.levels[fid] || 1);
    b.level = level; save();
    if (level >= 2 && familyCards(fid, b).length) return screenPickCard(fid, level);
    askQuestion(fid);
  }
  /* Niveaux 2 et 3 : l'élève choisit lui-même sa carte ; « Aide-moi à choisir » ramène au guidage (noté). */
  function screenPickCard(fid, level) {
    var b = U.block, st = student(b.sid), ids = [], recall = null;
    if (level >= 3) st.pinned.forEach(function (id) { if (usable(id, b)) ids.push(id); });
    var last = lastHelpful(b.sid, fid);
    if (last && usable(last, b) && ids.indexOf(last) < 0) { ids.unshift(last); recall = last; }
    familyCards(fid, b).forEach(function (id) { if (ids.length < 3 && ids.indexOf(id) < 0) ids.push(id); });
    ids = ids.slice(0, 3);
    U.line = { fam: fid, seq: ids.slice(), free: true };
    var html = title("Quelle carte veux-tu essayer ?");
    if (recall) html += '<p class="recall">La dernière fois, « ' + esc(card(recall).title) + " » t’a aidé.</p>";
    html += '<div class="choices">' + ids.map(function (id) {
      var c = card(id); return choice("pickCard", { id: id }, c.title, null, c.text);
    }).join("") + "</div>" +
      '<div class="foot">' + backLink() + '<button class="link" data-a="unfold">' + svg("question") + "Aide-moi à choisir</button></div>";
    show(html);
  }
  /* Au plus quatre choix à l'écran : au-delà de quatre réponses, trois d'abord puis « Autre chose » (le reste, même question). */
  function askQuestion(qid, keep, rest) {
    var q = QUESTIONS[qid], b = U.block, shown, more = false;
    if (!keep) U.qstack = [];
    U.qid = qid; U.rest = !!rest;
    U.opts = q.options.filter(function (o) { return !o.line || lineOpen(o.line, b); });
    shown = U.opts.map(function (o, i) { return i; });
    if (shown.length > 4) { if (rest) shown = shown.slice(3); else { shown = shown.slice(0, 3); more = true; } }
    show(title(q.text) + '<div class="choices">' + shown.map(function (i) {
      var o = U.opts[i], label = o.label || lineLabel(o.line);
      var cls = o.label === "Oui" ? "yes" : (o.label === "Non" ? "no" : "");
      return choice("answer", { i: i }, label, o.label === "Oui" ? "check" : (o.label === "Non" ? "cross" : null), null, cls);
    }).join("") + (more ? choice("moreOpts", {}, "Autre chose", "dots") : "") + "</div>" +
      '<div class="foot">' + prevLink(rest ? "lessOpts" : "prevQ") + backLink() + "</div>");
  }
  function prevLink(action) {
    return '<button class="link" data-a="' + action + '">' + svg("back") + "Étape précédente</button>";
  }
  function cheerHtml(text) {
    return '<div class="choice-row"><p class="cheer">' + esc(text) + "</p>" + sayBtn(text) + "</div>";
  }
  function answer(i) {
    var o = (U.opts || [])[i], b = U.block;
    if (!o) return;
    b.answers.push(o.label || lineLabel(o.line));
    if (o.next) { U.qstack.push(U.qid); save(); return askQuestion(o.next, true); }
    setLine(o.line);
  }
  function setLine(lid) {
    var b = U.block, L = LINES[lid], need = needsCtx(lid, b);
    if (need) { U.pending = { line: lid }; return screenAsk(need); }
    b.line = b.line && b.switched ? b.line + ">" + lid : lid;
    U.line = { fam: L.fam, seq: effectiveSeq(lid, b), then: L.then };
    save();
    var next = nextUntried(U.line.seq, b);
    if (!next) return goHelp();
    proposeCard(next, "proposee");
  }
  /* « Ça ne va pas du tout » : quatre outils d'apaisement, ou un adulte. Après l'outil, on passe à l'écran d'aide. */
  function screenCalm() {
    show(title("On se calme d’abord.") + '<div class="choices">' + CALM_TOOLS.map(function (x) {
      return choice("calmPick", { id: x[0] }, x[1], x[2], null, "calm");
    }).join("") + "</div>" +
      '<div class="foot">' + backLink() + '<button class="link" data-a="calmHelp">' + svg("people") + "Je veux un adulte</button></div>");
  }
  function proposeCard(id, origin, cheer) {
    if (id === "C19") return goHelp();
    var c = card(id), b = U.block, alts, back;
    U.cardId = id; U.origin = origin; U.peek = false; U.step = 0;
    U.mode = methodState(id, b.sid) || 1;
    alts = alternatives(b, id);
    /* « Étape précédente » seulement tant que rien n'a été essayé : on revient à la question, la réponse est retirée */
    back = !b.tries.length && !b.switched && !b.extra && !b.help && b.family !== "F0" && U.qid && b.answers.length && U.line && !U.line.free;
    show(title("Essaie ça.") + (cheer ? cheerHtml(cheer) : "") + cardHtml(c, U.mode, "preview") +
      '<button class="big" data-a="try">' + svg("play") + "J’essaie</button>" +
      '<div class="foot">' + (back ? prevLink("prevCard") : "") + backLink() +
      (alts.length && b.family !== "F0" ? '<button class="link" data-a="other">' + svg("loop") + "Une autre idée</button>" : "") + "</div>");
  }
  function stepsHtml(c) {
    return (c.steps.length === 1 ? "<p>" + esc(c.steps[0]) + "</p>"
      : '<ol class="steps">' + c.steps.map(function (s) { return "<li><span>" + esc(s) + "</span></li>"; }).join("") + "</ol>") +
      (c.truc ? '<p class="truc"><b>Mon truc :</b> ' + esc(c.truc) + "</p>" : "");
  }
  function annexHtml(kind) {
    var sid = U.block ? U.block.sid : U.sid, ids;
    if (kind === "dico") return '<details class="annex"><summary>Mon dico des verbes de consigne</summary><div class="in"><table><tbody>' +
      DICO.map(function (r) { return "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td></tr>"; }).join("") +
      "</tbody></table><p><b>Les petits mots pièges</b></p>" + PIEGES.map(function (x) { return "<p>" + esc(x) + "</p>"; }).join("") + "</div></details>";
    if (kind === "cles") return '<details class="annex"><summary>Mon trousseau de clés</summary><div class="in"><table><tbody>' +
      CLES.map(function (r) { return "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td></tr>"; }).join("") + "</tbody></table></div></details>";
    if (kind === "boite") {
      ids = knownMethods(sid, "fr");
      return ids.length ? '<details class="annex"><summary>Ma boîte à outils</summary><div class="in">' + ids.map(function (id) {
        var m = card(id); return "<p><b>" + esc(m.num) + "</b> · " + esc(m.title) + "</p>";
      }).join("") + "</div></details>" : "";
    }

      '<div class="panel"><h2>Comment l’outil choisit</h2>' +
      "<p>Il croise le blocage, la tâche, la matière et le lieu. S’il lui manque une information qui change la stratégie, il la demande en un écran.</p>" +
      "<p>Cinq domaines de stratégies : le dossier de français (14), les maths (7), réviser et mémoriser (6), les langues (6), la fatigue et le stress (6). S’y ajoutent les cartes générales et quatre outils d’apaisement guidés, repris du site PL-CPS’.</p>" +
      "<p><b>Outils d’apaisement</b> : respiration carrée (le point parcourt le carré, 4 cycles d’environ une minute), pieds au sol (30 s), je serre, je relâche (3 tours), mon endroit calme (1 min). Ils s’ouvrent depuis « Ça ne va pas du tout » (l’élève en choisit un, ou demande un adulte) et sont proposés dans « Je stresse », « Je suis fatigué ou agité » et « Tout est faux ».</p></div>" +
      '<div class="panel"><h2>Le retrait de l’aide</h2>' +
      "<p>Chaque stratégie a quatre états par élève : pas encore vue, guidée étape par étape, avec la carte, seul. Le dossier de français commence « pas encore vu » ; le reste commence « guidé ».</p>" +
      "<p>Après trois reprises de suite avec une stratégie, « Suivi » vous suggère d’alléger. Après deux échecs de suite, ou deux cartes rouvertes au niveau « seul », il suggère de renforcer. Rien ne change sans votre validation. Ces seuils sont des valeurs de départ, sans base empirique.</p></div>" +
      '<div class="panel"><h2>En classe</h2>' +
      "<p>1. Présentez d’abord les stratégies vous-même, sur une vraie tâche : l’outil rappelle une stratégie, il ne l’enseigne pas.</p>" +
      "<p>2. Donnez une règle simple : « deux minutes sans avancer, j’appuie ».</p>" +
      "<p>3. Après trois essais sans reprise, l’outil aide à formuler une demande précise, ou à mettre un « ? » dans la marge et à passer à la suite.</p>" +
      "<p>4. Après un « Non », l’outil dit une phrase courte qui reconnaît l’effort (« Pas grave. On essaie autre chose. »). Il ne donne ni points ni récompenses. « Ça ne va pas du tout » est toujours visible, à part des cinq familles.</p>" +
      "<p>5. Pour poser une question, l’élève voit au plus quatre réponses : « Autre chose » ouvre les suivantes. « Étape précédente » corrige une erreur de tap sans abandonner le blocage. Pendant une stratégie, « Je n’y arrive pas » compte comme un « Non » sans obliger l’élève à faire semblant de finir.</p></div>" +
      '<div class="panel"><h2>Le code de cet espace</h2>' +
      "<p>Le code de départ est " + DEFAULT_PIN + ". Changez-le dans « Réglages » : il est lisible dans le code source du site. Chaque élève peut aussi avoir son propre code (« Élèves ») : il est demandé quand on touche sa vignette, et le code de l’espace enseignante l’ouvre aussi. Si vous effacez le code de l’espace enseignante, tout élève qui touche le bouton « tableau » en haut de l’accueil entre ici, et un rappel s’affiche en haut de cet espace (« Plus tard » le masque jusqu’au prochain retour à l’accueil).</p></div>" +
      '<div class="panel"><h2>Adulte disponible ou non</h2>' +
      "<p>L’élève l’indique au démarrage de la tâche et peut le changer sur l’écran de travail. S’il ne l’a pas dit en tâche suivie, l’outil le demande au moment de l’aide. En coup de main, la question est posée au départ.</p>" +
      "<p>Sans adulte : l’outil propose une stratégie de plus (la suite prévue, sinon une carte générale utilisable seul : chercher dans le cours, regarder un exemple, commencer par le facile…), puis l’élève prépare sa question et met un « ? » dans la marge. « Suivi » indique les blocages sans adulte disponible.</p></div>" +
      '<div class="panel"><h2>Ce que vous notez</h2>' +
      "<p>Dans « Suivi », pour les blocages que vous avez vus : votre avis sur la cause, et si le travail a réellement repris dans les cinq minutes. Ce sont les deux mesures qui comptent ; les réponses de l’élève ne suffisent pas.</p></div>" +
      '<div class="panel"><h2>Limites du prototype</h2>' +
      "<p>La cause choisie par l’élève est une hypothèse, pas un diagnostic. L’outil ignore le contenu de la tâche : il ne vérifie ni la compréhension ni la justesse.</p>" +
      "<p>Il ne donne aucun conseil de sommeil ni de santé. Des blocages « fatigué » fréquents se discutent avec l’élève.</p>" +
      "<p>Aucune preuve n’établit encore que cet outil aide. Il sert à le vérifier avec vos élèves.</p></div>";

    },
    methodAll: function (el) {
      var st = student(el.dataset.id), v = parseInt(el.value, 10) || 0, t = now();
      if (!st || el.value === "") return;
      strategyIds().forEach(function (id) { st.methods[id] = v; st.msince[id] = t; });
      touchCfg(st); save(); openTeacher();
    },
    famLabel: function (el) { setLabel("families", el.dataset.id, "label", el.value); },
    lineLabel: function (el) { setLabel("lines", el.dataset.id, "label", el.value); },
    cardTitle: function (el) { setLabel("cards", el.dataset.id, "title", el.value); },
    cardText: function (el) { setLabel("cards", el.dataset.id, "text", el.value); },
    cardMin: function (el) { var n = parseInt(el.value, 10); setLabel("cards", el.dataset.id, "min", n > 0 && n <= 30 ? n : 0); },
    cardActive: function (el) { setLabel("cards", el.dataset.id, "active", el.checked); }
  };
  function setLabel(group, id, field, value) {
    var o = S.labels[group][id] || (S.labels[group][id] = {});
    if (typeof value === "string") value = value.trim();
    if (value === "" || value === 0) delete o[field]; else o[field] = value;
    save();
  }
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "importFile") return importFile(el);
    var fn = el.getAttribute && CHANGES[el.getAttribute("data-c")];
    if (fn) fn(el);
  });
  /* ---------- fusion d'un fichier dans les données de l'appareil (aucune suppression) ---------- */
  var CFG_FIELDS = ["name", "icon", "levels", "lock", "since", "methods", "msince", "mdismiss", "plan", "check", "code"];
  function blockScore(b) { return (b.end ? 1000 : 0) + (b.tries || []).length * 10 + (b.resumedAt ? 1 : 0); }
  function taskScore(t) { return (t.end ? 100 : 0) + (t.status ? 10 : 0) + (t.plan && t.plan.length ? 1 : 0); }
  function fillTeacher(w, o) {
    var k, ch = false;
    w.teacher = w.teacher || {};
    for (k in (o.teacher || {})) {
      if (Object.prototype.hasOwnProperty.call(o.teacher, k) && k !== "__proto__" && (w.teacher[k] === undefined || w.teacher[k] === "") && o.teacher[k] !== undefined && o.teacher[k] !== "") { w.teacher[k] = o.teacher[k]; ch = true; }
    }
    return ch;
  }
  function mergeData(data, byName) {
    var inc = normalize(JSON.parse(JSON.stringify(data))), r = { stAdd: 0, stUpd: 0, stSame: 0, byName: 0, bNew: 0, bUpd: 0, bSame: 0, tNew: 0, tUpd: 0, tSame: 0, skip: 0 }, map = {}, empty = !S.students.length && !S.tasks.length && !S.blocks.length;
    function mapSid(sid) { return map[sid] || (student(sid) ? sid : null); }
    inc.students.forEach(function (n) {
      if (!n || typeof n.id !== "string" || typeof n.name !== "string") { r.skip++; return; }
      var l = student(n.id), i, changed = false;
      if (!l && byName) {
        var nm = n.name.trim().toLowerCase();
        for (i = 0; i < S.students.length; i++) if (S.students[i].name.trim().toLowerCase() === nm) { l = S.students[i]; r.byName++; break; }
      }
      if (!l) { S.students.push(n); map[n.id] = n.id; r.stAdd++; return; }
      map[n.id] = l.id;
      if ((n.cfgAt || 0) > (l.cfgAt || 0)) { CFG_FIELDS.forEach(function (f) { l[f] = n[f]; }); l.cfgAt = n.cfgAt; changed = true; }
      n.pinned.forEach(function (id) { if (l.pinned.indexOf(id) < 0) { l.pinned.push(id); changed = true; } });
      while (l.pinned.length > 3) l.pinned.shift();
      if (changed) r.stUpd++; else r.stSame++;
    });
    inc.tasks.forEach(function (t) {
      var sid = t && typeof t.id === "string" ? mapSid(t.sid) : null, l;
      if (!sid) { r.skip++; return; }
      t.sid = sid; l = byId(S.tasks, t.id);
      if (!l) { S.tasks.push(t); r.tNew++; }
      else if (taskScore(t) > taskScore(l)) { S.tasks[S.tasks.indexOf(l)] = t; r.tUpd++; }
      else r.tSame++;
    });
    inc.blocks.forEach(function (b) {
      var sid = b && typeof b.id === "string" ? mapSid(b.sid) : null, l;
      if (!sid) { r.skip++; return; }
      b.sid = sid; l = byId(S.blocks, b.id);
      if (!l) { S.blocks.push(b); r.bNew++; }
      else if (blockScore(b) > blockScore(l)) { fillTeacher(b, l); S.blocks[S.blocks.indexOf(l)] = b; r.bUpd++; }
      else if (fillTeacher(l, b)) r.bUpd++;
      else r.bSame++;
    });
    ["families", "lines", "cards"].forEach(function (g) {
      var id, f, src = inc.labels[g] || {};
      for (id in src) {
        if (!Object.prototype.hasOwnProperty.call(src, id) || id === "__proto__") continue;
        S.labels[g][id] = S.labels[g][id] || {};
        for (f in src[id]) if (Object.prototype.hasOwnProperty.call(src[id], f) && f !== "__proto__" && !(f in S.labels[g][id])) S.labels[g][id][f] = src[id][f];
      }
    });
    /* sauvegarde complète restaurée sur un appareil vide : on reprend aussi les réglages, sauf le code */
    if (empty && data.kind !== "eleve" && data.settings && typeof data.settings === "object") {
      Object.keys(inc.settings).forEach(function (k) { if (k !== "pin" && k !== "v3" && data.settings && k in data.settings) S.settings[k] = inc.settings[k]; });
    }
    return r;
  }
  function describeMerge(r) {
    var p = [];
    p.push(r.stAdd + " élève(s) ajouté(s), " + r.stUpd + " mis à jour, " + r.stSame + " inchangé(s)" + (r.byName ? " (dont " + r.byName + " reconnu(s) par le prénom)" : ""));
    p.push("blocages : " + r.bNew + " nouveau(x), " + r.bUpd + " complété(s), " + r.bSame + " déjà présent(s)");
    p.push("tâches : " + r.tNew + " nouvelle(s), " + r.tUpd + " complétée(s), " + r.tSame + " déjà présente(s)");
    if (r.skip) p.push(r.skip + " ligne(s) ignorée(s) (élève inconnu ou incomplète)");
    return p.join(" ; ") + ".";
  }
  function importFile(el) {
    var files = Array.prototype.slice.call(el.files || []), bn = document.getElementById("importByName"), byName = !!(bn && bn.checked), notes = [], i = 0;
    if (!files.length) return;
    function next() {
      if (i >= files.length) { U.importNotes = notes; U.teacherTab = "donnees"; if (!U.teacherSid && S.students.length) U.teacherSid = S.students[0].id; save(); openTeacher(); return; }
      var f = files[i++], r = new FileReader();
      r.onload = function () {
        var backup = JSON.stringify(S);
        try {
          var data = JSON.parse(String(r.result));
          if (!data || data.version !== 1 || !Array.isArray(data.students)) throw new Error("format");
          notes.push({ ok: true, text: f.name + " : " + describeMerge(mergeData(data, byName)) });
        } catch (err) {
          S = normalize(JSON.parse(backup));
          notes.push({ ok: false, text: f.name + " : fichier non reconnu, rien n’a été importé." });
        }
        next();
      };
      r.onerror = function () { notes.push({ ok: false, text: f.name + " : lecture impossible." }); next(); };
      r.readAsText(f);
    }
    next();
  }
  /* l'état ouvert ou fermé d'un repli est gardé quand l'écran est reconstruit (« toggle » ne remonte pas : on l'écoute en capture) */
  document.addEventListener("toggle", function (e) {
    var d = e.target, k = d && d.getAttribute && d.getAttribute("data-k");
    if (k) { U.open = U.open || {}; U.open[k] = d.open; }
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "pin") ACTIONS.unlock();
    if (e.key === "Enter" && e.target && e.target.id === "newName") ACTIONS.addStudent();
    if (e.key === "Enter" && e.target && e.target.id === "scode") ACTIONS.codeOk();
  });

  /* hors ligne : uniquement sur un vrai serveur (GitHub Pages), pas en file:// */
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}

  /* voix : liste des voix du système (elle arrive parfois après le chargement) et état de la voix naturelle */
  if (synth) { loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch (e) {} }
  window.addEventListener("online", loadVoices); window.addEventListener("offline", loadVoices);
  piperCheck();
  document.addEventListener("input", function (e) { if (e.target && e.target.id === "sRate") { var o = document.getElementById("oRate"); if (o) o.textContent = String(e.target.value).replace(".", ","); } });

  goHome();
}
boot();
</script></body></html>
