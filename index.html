    /* Outil non projeté (décision du 2026-10-22) : plus d'agrandissement automatique ; la colonne élève s'élargit un peu. */
    @media (min-width: 700px) { .page:not(.wide) { max-width: 860px; } }

    /* ===== Écrans élève : « le nœud et le fil » (2026-10-22) =====
       Un blocage est un nœud : chaque essai le desserre. Trois tons d'écran (body[data-tone]) : deep = je cherche, calm = je me calme,
       light = je fais, win = ça repart. Les écrans de l'espace enseignante (.wide) ne changent pas. */
    body[data-layout="full"][data-tone="deep"], body[data-layout="full"][data-tone="calm"], .fld-deep, .fld-calm {
      --tbg: var(--deep); color: var(--ink);
      --bg: var(--tbg); --ink: var(--on-deep); --muted: var(--on-deep); --surface: transparent; --surface-alt: color-mix(in srgb, var(--on-deep) 14%, transparent);
      --rule: color-mix(in srgb, var(--on-deep) 32%, transparent); --border: var(--rule); --line-strong: var(--rule); --line-ctl: var(--on-deep);
      --accent: var(--on-deep); --on-accent: var(--tbg); --accent-soft: color-mix(in srgb, var(--on-deep) 16%, transparent); --shadow: none;
    }
    body[data-layout="full"][data-tone="calm"], .fld-calm { --tbg: var(--calm-deep); }
    /* deux champs de couleur : le haut porte la question, le bas porte les actions ; la ligne qui les sépare est le fil
       (une courbe douce quand ça coince, qui s'aplatit à chaque essai, droite quand ça repart) */
    body { position: relative; }
    .page { position: relative; z-index: 1; }
    .field { position: absolute; top: 0; left: 0; right: 0; z-index: 0; pointer-events: none; display: none; }
    body[data-layout="split"] .field { display: block; }
    .field .ft { background: var(--deep); }
    .field .fe { position: absolute; left: 0; width: 100%; display: block; overflow: visible; }
    .field .ff { fill: var(--deep); }
    .field[data-f="calm"] .ft { background: var(--calm-deep); } .field[data-f="calm"] .ff { fill: var(--calm-deep); }
    .field[data-f="win"] .ft { background: var(--bg); } .field[data-f="win"] .ff { fill: var(--bg); }
    .field .fl { fill: none; stroke: var(--ink); stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    body[data-layout="split"][data-field="win"] { background: var(--deep); }
    .fld-gap { flex: none; height: clamp(44px, 9vw, 76px); }
    body[data-layout="split"] main.center { justify-content: flex-start; }
    .col-h, .col-b { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .col-b { flex: 1; }
    .col-h > h1, .col-b > h1 { flex: none; }
    /* l'en-tête de carte est sorti de la carte (colonne du haut) : ses styles ne dépendent plus de .card */
    .st .cardhead { display: flex; flex-direction: column; gap: 4px; background: none; margin: 0; padding: 0; border-radius: 0; }
    .st .cardhead .cardtop { display: flex; align-items: flex-start; gap: 10px; }
    .st .cardhead h2 { flex: 1; margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.8rem, 7.4vw, 2.6rem); line-height: 1.08; letter-spacing: -0.02em; }
    .st .cardhead .overline { color: var(--muted); font-size: 1rem; font-weight: 700; }
    .st .card.guide .cardhead, .st .cardhead:has(+ *) { text-align: left; }
    .field .fv { display: none; }
    /* grand écran : la ligne devient verticale ; colonne gauche = en-tête et titre, colonne droite = choix et actions */
    @media (min-width: 900px) {
      body[data-layout="split"] .page.st { max-width: none; padding: 0; gap: 0; display: grid; grid-template-columns: 42% 76px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
      body[data-layout="split"] .page.st > header.top { grid-column: 1; grid-row: 1; padding: 28px 32px 0 56px; }
      body[data-layout="split"] main, body[data-layout="split"] main > .done.restart { display: contents; }
      body[data-layout="split"] .col-h { grid-column: 1; grid-row: 2; padding: 16px 32px 56px 56px; justify-content: center; }
      body[data-layout="split"] .col-b { grid-column: 3; grid-row: 1 / 3; padding: 56px 56px 56px 8px; justify-content: center; max-width: 780px; width: 100%; }
      body[data-layout="split"] .fld-gap { display: none; }

      body[data-layout="split"] .field .fe { display: none; }
      body[data-layout="split"] .field .fv { display: block; position: absolute; top: 0; left: 42%; width: 76px; height: 100%; margin-left: -1px; overflow: visible; }
    }
    .st .big, .st .btn.primary { color: var(--on-accent); }

    .st h1 { font-weight: 500; font-size: clamp(2rem, 9.2vw, 3.4rem); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }

    .card .cardtop .knot { width: clamp(56px, 16vw, 130px); }

    /* le fil : une station par étape du blocage ; le repère jaune dit « tu es ici » (le libellé le dit aussi) */
    .trail { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 -2px; }
    .trail::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 14px; height: 4px; border-radius: 2px; background: var(--rule); }
    .trail .st-i { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; font-size: 0.9rem; font-weight: 700; text-align: center; }
    .trail .st-i i { display: block; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: var(--bg); }
    .trail .st-i.done i { background: var(--ink); }

    .trail .bead { position: absolute; top: 0; left: calc(12.5% + 25% * var(--i, 0) - 16px); width: 32px; height: 32px; border-radius: 50%; background: var(--mark); border: 4px solid var(--ink); transition: left .35s ease; }
    /* choix : une liste sur le fil, plus une pile de cartes */
    .st .choices { position: relative; display: block; margin-inline: -8px; border-top: 0; }
    .st .choices::before { display: none; }

    .st .choices .choice-row:has(.choice:hover), .st .choices .choice-row:has(.choice:focus-visible), .st .choices .choice-row:has(.choice:active) { background: var(--ink); color: var(--bg); }
    .st .choice { position: relative; border: 0; border-radius: 0; background: transparent; box-shadow: none; min-height: 80px; padding: 12px 8px; gap: 18px; color: inherit; font-weight: 500; font-size: clamp(1.2rem, 5vw, 1.6rem); transition: none; }
    .st .choice:active { transform: none; }
    /* fin de ligne : un bout de fil terminé par un point (le geste « je choisis ce fil ») */
    .st .choice:not([data-a="checkToggle"])::after, .st .tile:not(.sel)::after { content: ""; flex: none; width: clamp(44px, 12vw, 72px); height: 16px; margin-left: auto; background: linear-gradient(currentColor, currentColor) left center / calc(100% - 8px) 4px no-repeat, radial-gradient(circle 7px at 8px 8px, currentColor 98%, transparent) right center / 16px 16px no-repeat; }
    .st .choice.yes::after, .st .choice.no::after, .st .choice.mid::after { display: none; }
    .st .choice .ic { display: none; }

    .st .choice small { color: inherit; opacity: 1; }
    .st .choice-row .say { width: 56px; border: 0; border-radius: 0; background: transparent; color: inherit; }
    .st .choice.sel { background: var(--accent-soft); }
    .st .choices.apart { margin: 8px 0 0; padding-top: 0; border-top: 0; }

    .st .choices.apart .choice-row:has(.choice:hover), .st .choices.apart .choice-row:has(.choice:focus-visible) { background: transparent; color: inherit; }
    .st .choice.calm { min-height: 76px; padding: 10px 8px; gap: 14px; background: none; color: var(--calm); box-shadow: none; border-radius: 0; font-weight: 600; }
    .st .choice.calm::before { display: none; }

    .st .cheer { margin: 0; padding: 0; background: none; font-weight: 700; }
    /* écran d'aide : « Tu as bien essayé » mène (même poids que le titre), la feuille et la consigne forment un seul bloc */
    .st main:has(.starter) h1 { font-size: clamp(1.8rem, 7.2vw, 2.6rem); }

  function tabAide() {
    return '<div class="panel"><h2>Présenter l’outil à la classe</h2>' +
      "<p>Quatre écrans à projeter pour expliquer la démarche : « Je travaille », « Je bloque », « Je cherche une stratégie », « J’essaie ». Les élèves peuvent les rouvrir eux-mêmes avec « Comment ça marche ? », sur l’accueil et sur l’écran de travail.</p>" +
      '<div class="row"><button class="btn primary" data-a="guide" data-from="teacher">' + svg("board") + "Montrer le guide à la classe</button></div></div>" +
      '<div class="panel"><h2>Deux façons de l’utiliser</h2>' +
      "<p><b>Avec suivi.</b> L’élève choisit sa vignette, sa tâche, sa matière, le lieu, et dit si un adulte peut l’aider. L’outil enregistre les blocages, les stratégies essayées et les reprises.</p>" +
      "<p><b>Juste un coup de main.</b> On commence directement par « Où ça coince ? » ; « Un adulte peut t’aider ? » n’est posé qu’au moment de l’aide. Rien n’est enregistré, sauf si l’on choisit « Enregistrer pour un élève ». C’est le mode à projeter, et celui qui convient à la maison : chaque appareil garde ses propres données, vous ne voyez pas ce qui s’y passe.</p></div>" +
      '<div class="panel"><h2>Comment l’outil choisit</h2>' +
      "<p>Il croise le blocage, la tâche, la matière et le lieu. S’il lui manque une information qui change la stratégie, il la demande en un écran.</p>" +
      "<p>Cinq domaines de stratégies : le dossier de français (13), les maths (7), réviser et mémoriser (6), les langues (5), la fatigue et le stress (6). S’y ajoutent les cartes générales et quatre outils d’apaisement guidés, repris du site PL-CPS’.</p>" +
      "<p><b>Outils d’apaisement</b> : respiration carrée (le point parcourt le carré, 4 cycles d’environ une minute), pieds au sol (30 s), je serre, je relâche (3 tours), mon endroit calme (1 min). Ils s’ouvrent depuis « Ça ne va pas du tout » (l’élève en choisit un, ou demande un adulte) et sont proposés dans « Je stresse », « Je suis fatigué ou agité » et « Tout est faux ».</p></div>" +
      '<div class="panel"><h2>Le retrait de l’aide</h2>' +
      "<p>Chaque stratégie a quatre états par élève : pas encore vue, guidée étape par étape, avec la carte, seul. Le dossier de français commence « pas encore vu » ; le reste commence « guidé ».</p>" +
      "<p>Après trois reprises de suite avec une stratégie, « Suivi » vous suggère d’alléger. Après deux échecs de suite, ou deux cartes rouvertes au niveau « seul », il suggère de renforcer. Rien ne change sans votre validation. Ces seuils sont des valeurs de départ, sans base empirique.</p></div>" +
      '<div class="panel"><h2>En classe</h2>' +
      "<p>1. Présentez d’abord les stratégies vous-même, sur une vraie tâche : l’outil rappelle une stratégie, il ne l’enseigne pas.</p>" +
      "<p>2. Donnez une règle simple : « deux minutes sans avancer, j’appuie ».</p>" +
      "<p>3. Après trois essais sans reprise, une courte pause (un message, un bouton « Continuer ») précède l’aide : l’outil aide alors à formuler une demande précise, ou à mettre un « ? » dans la marge et à passer à la suite.</p>" +
      "<p>4. Après un « Pas encore », l’outil dit une phrase courte qui reconnaît l’effort (« Pas grave. On essaie autre chose. »). Il ne donne ni points ni récompenses. « Ça ne va pas du tout » est toujours visible, à part des cinq familles.</p>" +
      "<p>5. Pour poser une question, l’élève voit au plus quatre réponses : « Autre chose » ouvre les suivantes. « Étape précédente » corrige une erreur de tap sans abandonner le blocage, et « Je me suis trompé » annule la dernière réponse à « Ça repart ? ». Pendant une stratégie, « Je n’y arrive pas » compte comme un « Pas encore » sans obliger l’élève à faire semblant de finir.</p></div>" +
      '<div class="panel"><h2>Le code de cet espace</h2>' +
      "<p>Le code de départ est " + DEFAULT_PIN + ". Changez-le dans « Réglages » : il est lisible dans le code source du site. Chaque élève peut aussi avoir son propre code (« Élèves ») : il est demandé quand on touche sa vignette, et le code de l’espace enseignante l’ouvre aussi. Si vous effacez le code de l’espace enseignante, tout élève qui touche le bouton « tableau » en haut de l’accueil entre ici, et un rappel s’affiche en haut de cet espace (« Plus tard » le masque jusqu’au prochain retour à l’accueil).</p></div>" +
      '<div class="panel"><h2>Adulte disponible ou non</h2>' +
      "<p>L’élève l’indique au démarrage de la tâche et peut le changer sur l’écran de travail. S’il ne l’a pas dit en tâche suivie, l’outil le demande au moment de l’aide. En coup de main, la question est posée au départ.</p>" +
      "<p>Sans adulte : l’outil propose une stratégie de plus (la suite prévue, sinon une carte générale utilisable seul : chercher dans le cours, regarder un exemple, commencer par le facile…), puis l’élève prépare sa question et met un « ? » dans la marge. « Suivi » indique les blocages sans adulte disponible.</p></div>" +
      '<div class="panel"><h2>Ce que vous notez</h2>' +
      "<p>Dans « Suivi », pour les blocages que vous avez vus : votre avis sur la cause, et si le travail a réellement repris dans les cinq minutes. Ce sont les deux mesures qui comptent ; les réponses de l’élève ne suffisent pas.</p></div>" +
      '<div class="panel"><h2>Limites du prototype</h2>' +
      "<p>La cause choisie par l’élève est une hypothèse, pas un diagnostic. L’outil ignore le contenu de la tâche : il ne vérifie ni la compréhension ni la justesse.</p>" +
      "<p>Il ne donne aucun conseil de sommeil ni de santé. Des blocages « fatigué » fréquents se discutent avec l’élève.</p>" +
      "<p>Aucune preuve n’établit encore que cet outil aide. Il sert à le vérifier avec vos élèves.</p></div>";
  }

      var i = draftPlan.indexOf(d.id);
      if (i >= 0) draftPlan.splice(i, 1); else draftPlan.push(d.id);
      el.className = "plan-item" + (i >= 0 ? "" : " sel"); el.setAttribute("aria-pressed", String(i < 0));
    },
    planAll: function () { U.planAll = true; screenPlan(); },
    planGo: function (d) { U.task.plan = d.skip ? [] : draftPlan.slice(); U.task.start = now(); save(); screenWork(); },
    passe: function () { endBlock("passe"); backToWork("C’est noté. On en reparlera."); },
    blocked: function () { blocked(); },
    family: function (d) { pickFamily(d.id); },
    moreOpts: function () { askQuestion(U.qid, true, true); },
    lessOpts: function () { askQuestion(U.qid, true, false); },
    prevQ: function () {
      var b = U.block, q; if (!b) return;
      if (U.qstack.length) { q = U.qstack.pop(); b.answers.pop(); save(); return askQuestion(q, true); }
      b.answers = []; b.family = null; b.level = null; save(); screenFamilies();
    },
    prevCard: function () {
      var b = U.block; if (!b || b.tries.length || !U.qid) return;
      b.answers.pop(); b.line = null; U.line = null; save(); askQuestion(U.qid, true);
    },
    goPin: function () { U.teacherTab = "reglages"; openTeacher(); var el = document.getElementById("newPin"); if (el) el.focus(); },
    laterPin: function () { U.pinLater = true; openTeacher(); },
    unfold: function () { U.block.unfolded = true; save(); askQuestion(U.block.family); },
    pickCard: function (d) { proposeCardChosen(d.id); },
    answer: function (d) { answer(parseInt(d.i, 10)); },
    try: function () { startTry(); },
    calmPick: function (d) { var b = U.block; U.cardId = d.id; U.origin = "choisie"; U.peek = false; U.mode = 1; U.line = { fam: "F0", seq: [d.id] }; save(); startTry(); },
    calmHelp: function () { goHelp(); },
    guideStop: function () { clearTimers(); tried(); },
    guideAgain: function () { startGuide(); },
    other: function () { var a = alternatives(U.block, U.cardId); if (a.length) proposeCard(a[0], "choisie"); },
    tried: function () { tried(); },
    backTry: function () { renderTry(); },
    undoResult: function () { undoResult(); },
    pauseGo: function () { goHelp(); },
    cardAsk: function (d) { cardAsk(d.v === "1"); },
    result: function (d) { result(parseFloat(d.r)); },
    "switch": function () { askQuestion(U.block.switched); },
    cancelBlock: function () { if (U.block && !U.block.end) { if (U.block.tries.length) endBlock("abandon"); else endBlock("annule"); } backToWork(); },
    helped: function () { endBlock("aide"); backToWork("C’est reparti. Bien joué d’avoir demandé de l’aide."); },
    stopClean: function () { endBlock("stop"); finishAs("reportee"); },
    finish: function () { screenFinish(); },
    finishAs: function (d) {
      var st = student(U.sid);
      if (d.s === "terminee" && st && st.check && !U.checkDone) return screenCheck();
      finishAs(d.s);
    },
    helpedMost: function (d) { helpedMost(d.id); },
    plan: function (d) { var st = student(U.sid); if (st.pinned.indexOf(d.id) < 0) togglePin(st, d.id); screenBye(); },
    bye: function () { screenBye(); },
    notebook: function () { screenNotebook(); },
    backFromNotebook: function () { pickStudent(U.sid); },
    pin: function (d) { togglePin(student(U.sid), d.id); screenNotebook(); },
    unlock: function () {
      var el = document.getElementById("pin");
      if (el && el.value === S.settings.pin) { U.unlocked = true; openTeacher(); }
      else { var er = document.getElementById("pinerr"); if (er) er.hidden = false; }
    },
    tab: function (d) { U.teacherTab = d.id; openTeacher(); },
    avatar: function (d) { var n = document.getElementById("newName"), v = n ? n.value : ""; newAvatar = d.id; openTeacher(); n = document.getElementById("newName"); if (n) n.value = v; },
    addStudent: function () {
      var n = document.getElementById("newName"), name = n ? n.value.trim() : "";
      if (!name) { if (n) n.focus(); return; }
      S.students.push({ id: uid("s"), name: name, icon: newAvatar, levels: {}, lock: {}, since: {}, pinned: [], methods: {}, msince: {}, mdismiss: {}, plan: false, check: false, code: "", cfgAt: now() });
      newAvatar = AVATARS[S.students.length % AVATARS.length];
      save(); openTeacher();
    },
    delStudent: function (d, el) {
      /* suppression en deux temps, sans boîte de dialogue du navigateur */
      if (el.getAttribute("data-sure") !== "1") { el.setAttribute("data-sure", "1"); el.textContent = "Confirmer la suppression (données comprises)"; return; }
      S.students = S.students.filter(function (s) { return s.id !== d.id; });
      S.tasks = S.tasks.filter(function (t) { return t.sid !== d.id; });
      S.blocks = S.blocks.filter(function (b) { return b.sid !== d.id; });
      save(); openTeacher();
    },
    savePin: function () { var el = document.getElementById("newPin"); S.settings.pin = el ? el.value.trim().slice(0, 20) : ""; save(); openTeacher(); },
    resetLabels: function (d, el) {
      if (el.getAttribute("data-sure") !== "1") { el.setAttribute("data-sure", "1"); el.textContent = "Confirmer : rétablir tous les textes"; return; }
      S.labels = { families: {}, lines: {}, cards: {} }; save(); openTeacher();
    },
    exportJson: function () { download("pl-restart-sauvegarde-" + stamp() + ".json", JSON.stringify(exportData(null), null, 2), "application/json"); },
    exportStudent: function () {
      var el = document.getElementById("expSid"), st = el && student(el.value);
      if (!st) return;
      download("pl-restart-" + slug(st.name) + "-" + stamp() + ".json", JSON.stringify(exportData(st.id), null, 2), "application/json");
    },
    exportCsv: function () { download("pl-restart-essais-" + stamp() + ".csv", csv(), "text/csv;charset=utf-8"); },
    wipe: function () {
      var el = document.getElementById("wipeWord");
      if (!el || el.value.trim() !== "EFFACER") { if (el) el.focus(); return; }
      S = fresh(); save(); U.teacherSid = null; openTeacher();
    }
  };
  /* Une stratégie du plan d'attaque : l'élève est guidé, l'essai est noté comme un blocage (cause « Mon plan d'attaque »). */
  function planTry(id) {
    var t = U.task, c = card(id); if (!t || !c) return;
    var b = newBlock(t); b.family = "plan"; b.line = "plan"; b.level = 1; b.adult = adultOf(b);
    U.line = { fam: "plan", seq: [id], free: true };
    U.cardId = id; U.origin = "choisie"; U.peek = false;
    U.mode = methodState(id, b.sid) || 1;
    save(); startTry();
  }
  function proposeCardChosen(id) {
    var b = U.block; b.line = "libre"; save();
    U.cardId = id; U.origin = "choisie"; U.peek = false;
    U.mode = methodState(id, b.sid) || 1;
    startTry();
  }
  /* « Voir la carte » ouvert par un élève réglé sur « Seul » : noté avec l'essai (l'événement toggle ne remonte pas, d'où la capture) */
  document.addEventListener("toggle", function (e) {
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute("data-peek") && el.open) U.peek = true;
  }, true);
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-a]") : null;
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute("data-a")];
    if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  /* champs de l'espace enseignante : enregistrés à la modification, sans reconstruire l'écran (le focus reste en place) */
  var CHANGES = {
    teacherSid: function (el) { U.teacherSid = el.value; openTeacher(); },
    teacherNote: function (el) { var b = byId(S.blocks, el.dataset.id); if (b) { b.teacher = b.teacher || {}; b.teacher[el.dataset.f] = el.value; save(); } },
    level: function (el) { var st = student(el.dataset.id); if (st) { st.levels[el.dataset.f] = parseInt(el.value, 10); st.since[el.dataset.f] = now(); touchCfg(st); save(); } },
    lock: function (el) { var st = student(el.dataset.id); if (st) { st.lock[el.dataset.f] = el.checked; touchCfg(st); save(); } },
    setting: function (el) { S.settings[el.dataset.f] = el.checked; save(); },
    stCode: function (el) { var st = student(el.dataset.id); if (st) { st.code = el.value.trim().slice(0, 20); touchCfg(st); save(); } },
    planOn: function (el) { var st = student(el.dataset.id); if (st) { st.plan = el.checked; touchCfg(st); save(); } },
    checkOn: function (el) { var st = student(el.dataset.id); if (st) { st.check = el.checked; touchCfg(st); save(); } },
    methodState: function (el) {
      var st = student(el.dataset.id), c, box, sum;
      if (!st) return;
      st.methods[el.dataset.m] = parseInt(el.value, 10) || 0; st.msince[el.dataset.m] = now(); touchCfg(st); save();
      c = card(el.dataset.m); box = el.closest && el.closest("details"); sum = box && box.querySelector("summary .sum");
      if (c && sum) { var ids = domIds(c.dom); sum.textContent = "· " + stateSummary(st, ids); }
    },
    voice: function (el) { S.settings.voice = el.value; save(); },
    rate: function (el) { var n = parseFloat(el.value); S.settings.rate = n >= 0.5 && n <= 1.3 ? n : 0.92; save(); var o = document.getElementById("oRate"); if (o) o.textContent = rateText(); },
    methodDom: function (el) {
      var st = student(el.dataset.id), dom = el.dataset.d, v = parseInt(el.value, 10) || 0, t = now();
      if (!st || el.value === "") return;
      strategyIds().forEach(function (id) { var c = card(id); if (c && c.dom === dom) { st.methods[id] = v; st.msince[id] = t; } });
      touchCfg(st); save(); openTeacher();
    },
    methodAll: function (el) {
      var st = student(el.dataset.id), v = parseInt(el.value, 10) || 0, t = now();
      if (!st || el.value === "") return;
      strategyIds().forEach(function (id) { st.methods[id] = v; st.msince[id] = t; });
      touchCfg(st); save(); openTeacher();
    },
    famLabel: function (el) { setLabel("families", el.dataset.id, "label", el.value); },
    lineLabel: function (el) { setLabel("lines", el.dataset.id, "label", el.value); },
    cardTitle: function (el) { setLabel("cards", el.dataset.id, "title", el.value); },
    cardText: function (el) { setLabel("cards", el.dataset.id, "text", el.value); },
    cardMin: function (el) { var n = parseInt(el.value, 10); setLabel("cards", el.dataset.id, "min", n > 0 && n <= 30 ? n : 0); },
    cardActive: function (el) { setLabel("cards", el.dataset.id, "active", el.checked); }
  };
  function setLabel(group, id, field, value) {
    var o = S.labels[group][id] || (S.labels[group][id] = {});
    if (typeof value === "string") value = value.trim();
    if (value === "" || value === 0) delete o[field]; else o[field] = value;
    save();
  }
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "importFile") return importFile(el);
    var fn = el.getAttribute && CHANGES[el.getAttribute("data-c")];
    if (fn) fn(el);
  });
  /* ---------- fusion d'un fichier dans les données de l'appareil (aucune suppression) ---------- */
  var CFG_FIELDS = ["name", "icon", "levels", "lock", "since", "methods", "msince", "mdismiss", "plan", "check", "code"];
  function blockScore(b) { return (b.end ? 1000 : 0) + (b.tries || []).length * 10 + (b.resumedAt ? 1 : 0); }
  function taskScore(t) { return (t.end ? 100 : 0) + (t.status ? 10 : 0) + (t.plan && t.plan.length ? 1 : 0); }
  function fillTeacher(w, o) {
    var k, ch = false;
    w.teacher = w.teacher || {};
    for (k in (o.teacher || {})) {
      if (Object.prototype.hasOwnProperty.call(o.teacher, k) && k !== "__proto__" && (w.teacher[k] === undefined || w.teacher[k] === "") && o.teacher[k] !== undefined && o.teacher[k] !== "") { w.teacher[k] = o.teacher[k]; ch = true; }
    }
    return ch;
  }
  function mergeData(data, byName) {
    var inc = normalize(JSON.parse(JSON.stringify(data))), r = { stAdd: 0, stUpd: 0, stSame: 0, byName: 0, bNew: 0, bUpd: 0, bSame: 0, tNew: 0, tUpd: 0, tSame: 0, skip: 0 }, map = {}, empty = !S.students.length && !S.tasks.length && !S.blocks.length;
    function mapSid(sid) { return map[sid] || (student(sid) ? sid : null); }
    inc.students.forEach(function (n) {
      if (!n || typeof n.id !== "string" || typeof n.name !== "string") { r.skip++; return; }
      var l = student(n.id), i, changed = false;
      if (!l && byName) {
        var nm = n.name.trim().toLowerCase();
        for (i = 0; i < S.students.length; i++) if (S.students[i].name.trim().toLowerCase() === nm) { l = S.students[i]; r.byName++; break; }
      }
      if (!l) { S.students.push(n); map[n.id] = n.id; r.stAdd++; return; }
      map[n.id] = l.id;
      if ((n.cfgAt || 0) > (l.cfgAt || 0)) { CFG_FIELDS.forEach(function (f) { l[f] = n[f]; }); l.cfgAt = n.cfgAt; changed = true; }
      n.pinned.forEach(function (id) { if (l.pinned.indexOf(id) < 0) { l.pinned.push(id); changed = true; } });
      while (l.pinned.length > 3) l.pinned.shift();
      if (changed) r.stUpd++; else r.stSame++;
    });
    inc.tasks.forEach(function (t) {
      var sid = t && typeof t.id === "string" ? mapSid(t.sid) : null, l;
      if (!sid) { r.skip++; return; }
      t.sid = sid; l = byId(S.tasks, t.id);
      if (!l) { S.tasks.push(t); r.tNew++; }
      else if (taskScore(t) > taskScore(l)) { S.tasks[S.tasks.indexOf(l)] = t; r.tUpd++; }
      else r.tSame++;
    });
    inc.blocks.forEach(function (b) {
      var sid = b && typeof b.id === "string" ? mapSid(b.sid) : null, l;
      if (!sid) { r.skip++; return; }
      b.sid = sid; l = byId(S.blocks, b.id);
      if (!l) { S.blocks.push(b); r.bNew++; }
      else if (blockScore(b) > blockScore(l)) { fillTeacher(b, l); S.blocks[S.blocks.indexOf(l)] = b; r.bUpd++; }
      else if (fillTeacher(l, b)) r.bUpd++;
      else r.bSame++;
    });
    ["families", "lines", "cards"].forEach(function (g) {
      var id, f, src = inc.labels[g] || {};
      for (id in src) {
        if (!Object.prototype.hasOwnProperty.call(src, id) || id === "__proto__") continue;
        S.labels[g][id] = S.labels[g][id] || {};
        for (f in src[id]) if (Object.prototype.hasOwnProperty.call(src[id], f) && f !== "__proto__" && !(f in S.labels[g][id])) S.labels[g][id][f] = src[id][f];
      }
    });
    /* sauvegarde complète restaurée sur un appareil vide : on reprend aussi les réglages, sauf le code */
    if (empty && data.kind !== "eleve" && data.settings && typeof data.settings === "object") {
      Object.keys(inc.settings).forEach(function (k) { if (k !== "pin" && k !== "v3" && data.settings && k in data.settings) S.settings[k] = inc.settings[k]; });
    }
    return r;
  }
  function describeMerge(r) {
    var p = [];
    p.push(r.stAdd + " élève(s) ajouté(s), " + r.stUpd + " mis à jour, " + r.stSame + " inchangé(s)" + (r.byName ? " (dont " + r.byName + " reconnu(s) par le prénom)" : ""));
    p.push("blocages : " + r.bNew + " nouveau(x), " + r.bUpd + " complété(s), " + r.bSame + " déjà présent(s)");
    p.push("tâches : " + r.tNew + " nouvelle(s), " + r.tUpd + " complétée(s), " + r.tSame + " déjà présente(s)");
    if (r.skip) p.push(r.skip + " ligne(s) ignorée(s) (élève inconnu ou incomplète)");
    return p.join(" ; ") + ".";
  }
  function importFile(el) {
    var files = Array.prototype.slice.call(el.files || []), bn = document.getElementById("importByName"), byName = !!(bn && bn.checked), notes = [], i = 0;
    if (!files.length) return;
    function next() {
      if (i >= files.length) { U.importNotes = notes; U.teacherTab = "donnees"; if (!U.teacherSid && S.students.length) U.teacherSid = S.students[0].id; save(); openTeacher(); return; }
      var f = files[i++], r = new FileReader();
      r.onload = function () {
        var backup = JSON.stringify(S);
        try {
          var data = JSON.parse(String(r.result));
          if (!data || data.version !== 1 || !Array.isArray(data.students)) throw new Error("format");
          notes.push({ ok: true, text: f.name + " : " + describeMerge(mergeData(data, byName)) });
        } catch (err) {
          S = normalize(JSON.parse(backup));
          notes.push({ ok: false, text: f.name + " : fichier non reconnu, rien n’a été importé." });
        }
        next();
      };
      r.onerror = function () { notes.push({ ok: false, text: f.name + " : lecture impossible." }); next(); };
      r.readAsText(f);
    }
    next();
  }
  /* l'état ouvert ou fermé d'un repli est gardé quand l'écran est reconstruit (« toggle » ne remonte pas : on l'écoute en capture) */
  document.addEventListener("toggle", function (e) {
    var d = e.target, k = d && d.getAttribute && d.getAttribute("data-k");
    if (k) { U.open = U.open || {}; U.open[k] = d.open; }
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "pin") ACTIONS.unlock();
    if (e.key === "Enter" && e.target && e.target.id === "newName") ACTIONS.addStudent();
    if (e.key === "Enter" && e.target && e.target.id === "scode") ACTIONS.codeOk();
  });

  /* hors ligne : uniquement sur un vrai serveur (GitHub Pages), pas en file:// */
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}

  /* voix : liste des voix du système (elle arrive parfois après le chargement) et état de la voix naturelle */
  if (synth) { loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch (e) {} }
  window.addEventListener("online", loadVoices); window.addEventListener("offline", loadVoices);
  piperCheck();
  document.addEventListener("input", function (e) { if (e.target && e.target.id === "sRate") { var o = document.getElementById("oRate"); if (o) o.textContent = String(e.target.value).replace(".", ","); } });

  goHome();
}
boot();
</script></body></html>
