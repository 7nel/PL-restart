      if (state < 3 && n >= 3 && tr.slice(-3).every(function (t) { return t.result >= 0.5; })) { to = c.steps.length === 1 ? 3 : state + 1; why = "3 reprises de suite"; }

    return '<div class="panel"><h2>Où sont les données</h2><p>Tout est enregistré dans le navigateur de cet appareil. Rien n’est envoyé. Un autre appareil, ou un autre navigateur, repart de zéro.</p>' +

      '<div class="panel"><h2>Exporter</h2><div class="row"><button class="btn primary" data-a="exportJson">Sauvegarde complète (.json)</button><button class="btn" data-a="exportCsv">Tableau des essais (.csv)</button></div>' +
      '<p class="small">Le fichier .csv s’ouvre dans Excel : une ligne par essai de carte.</p></div>' +
      '<div class="panel"><h2>Importer une sauvegarde</h2><p class="small">Remplace toutes les données de cet appareil par celles du fichier.</p><input type="file" id="importFile" accept=".json,application/json"><p class="note" id="importMsg" hidden></p></div>' +
      '<div class="panel"><h2>Effacer</h2><p class="small">Supprime élèves, tâches, blocages et réglages de cet appareil. Écrivez EFFACER pour confirmer.</p>' +
      '<div class="formrow"><label class="field"><span>Confirmation</span><input type="text" id="wipeWord" autocomplete="off"></label><button class="btn danger fit" data-a="wipe">Tout effacer</button></div></div>';
  }
  function tabAide() {
    return '<div class="panel"><h2>Deux façons de l’utiliser</h2>' +
      "<p><b>Avec suivi.</b> L’élève choisit sa vignette, sa tâche, sa matière et le lieu. L’outil enregistre les blocages, les stratégies essayées et les reprises.</p>" +
      "<p><b>Juste un coup de main.</b> On arrive droit sur « Où ça coince ? ». Rien n’est enregistré, sauf si l’on choisit « Enregistrer pour un élève ». C’est le mode à projeter, et celui qui convient à la maison : chaque appareil garde ses propres données, vous ne voyez pas ce qui s’y passe.</p></div>" +
      '<div class="panel"><h2>Comment l’outil choisit</h2>' +
      "<p>Il croise le blocage, la tâche, la matière et le lieu. S’il lui manque une information qui change la stratégie, il la demande en un écran.</p>" +
      "<p>Cinq domaines de stratégies : le dossier de français (14), les maths (7), réviser et mémoriser (6), les langues (6), la fatigue et le stress (6). S’y ajoutent les cartes générales.</p></div>" +
      '<div class="panel"><h2>Le retrait de l’aide</h2>' +
      "<p>Chaque stratégie a quatre états par élève : pas encore vue, guidée étape par étape, avec la carte, seul. Le dossier de français commence « pas encore vu » ; le reste commence « guidé ».</p>" +
      "<p>Après trois reprises de suite avec une stratégie, « Suivi » vous suggère d’alléger. Après deux échecs de suite, ou deux cartes rouvertes au niveau « seul », il suggère de renforcer. Rien ne change sans votre validation. Ces seuils sont des valeurs de départ, sans base empirique.</p></div>" +
      '<div class="panel"><h2>En classe</h2>' +
      "<p>1. Présentez d’abord les stratégies vous-même, sur une vraie tâche : l’outil rappelle une stratégie, il ne l’enseigne pas.</p>" +
      "<p>2. Donnez une règle simple : « deux minutes sans avancer, j’appuie ».</p>" +
      "<p>3. Après trois essais sans reprise, l’outil aide à formuler une demande précise, ou à mettre un « ? » dans la marge et à passer à la suite.</p></div>" +
      '<div class="panel"><h2>Ce que vous notez</h2>' +
      "<p>Dans « Suivi », pour les blocages que vous avez vus : votre avis sur la cause, et si le travail a réellement repris dans les cinq minutes. Ce sont les deux mesures qui comptent ; les réponses de l’élève ne suffisent pas.</p></div>" +
      '<div class="panel"><h2>Limites du prototype</h2>' +
      "<p>La cause choisie par l’élève est une hypothèse, pas un diagnostic. L’outil ignore le contenu de la tâche : il ne vérifie ni la compréhension ni la justesse.</p>" +
      "<p>Il ne donne aucun conseil de sommeil ni de santé. Des blocages « fatigué » fréquents se discutent avec l’élève.</p>" +
      "<p>Aucune preuve n’établit encore que cet outil aide. Il sert à le vérifier avec vos élèves.</p></div>";
  }
  function download(name, text, mime) {
    try {
      var blob = new Blob([text], { type: mime }), url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    } catch (e) {}
  }
  function stamp() { var d = new Date(); function p(n) { return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function csv() {
    var head = ["eleve", "date", "tache", "matiere", "statut_tache", "blocage", "minute_dans_tache", "famille", "reponses", "ligne", "niveau", "aide_a_choisir", "garde_fou", "rang_essai", "carte", "titre_carte", "origine", "duree_essai_s", "resultat", "issue", "delai_reprise_s", "rebond_5min", "avis_enseignante", "reprise_observee", "mode_strategie", "carte_rouverte", "plan_attaque", "plan_a_aide", "lieu"];
    var rows = [head];
    S.blocks.forEach(function (b) {
      if (!b.end || b.end === "annule") return;
      var st = student(b.sid) || { name: "?" }, t = byId(S.tasks, b.tid) || {};
      var plan = [(t.plan || []).join(" "), t.planHelped === null || t.planHelped === undefined ? "" : String(t.planHelped).replace(".", ","), t.place || b.place || ""];
      var base = [st.name, fmtDate(b.at), t.type || b.type || "", t.subject || b.subject || "", t.status || (b.tid ? "" : "coup de main"), b.id, b.tid ? Math.round(b.t / 60000) : "", b.family === "garde" ? "garde" : famLabel(b.family), b.answers.join(" | "), b.line || "", b.level || "", b.unfolded ? "oui" : "non", b.guard || ""];
      var tail = [END_LABELS[b.end] || b.end, b.resumedAt ? Math.round((b.resumedAt - b.at) / 1000) : "", rebound(b) ? "oui" : "non", (b.teacher && b.teacher.avis) || "", (b.teacher && b.teacher.reprise) || ""];
      if (!b.tries.length) rows.push(base.concat(["", "", "", "", "", ""], tail, ["", ""], plan));
      b.tries.forEach(function (x, i) {
        var c = card(x.card);
        rows.push(base.concat([i + 1, x.card, c ? c.title : "", x.origin || "", Math.round((x.dur || 0) / 1000), x.result === null ? "" : String(x.result).replace(".", ",")], tail, [x.mode ? MODE_NAMES[x.mode] : "", x.mode ? (x.peek ? "oui" : "non") : ""], plan));
      });
    });
    return "﻿" + rows.map(function (r) {
      return r.map(function (v) { v = String(v == null ? "" : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";");
    }).join("\r\n");
  }

  /* ---------- actions (délégation d'événements) ---------- */
  var ACTIONS = {
    say: function (d) { speak(d.t); },
    home: function () { goHome(); },
    teacher: function () { openTeacher(); },
    pick: function (d) { pickStudent(d.id); },
    resume: function () { U.task = openTask(U.sid); if (U.task) screenWork(); else screenTask(); },
    newTask: function () { var t = openTask(U.sid); if (t) { closeTask(t, "abandonnee"); save(); } screenTask(); },
    type: function (d) { draft.type = d.id; screenTask(); },
    subject: function (d) { draft.subject = draft.subject === d.id ? "" : d.id; screenTask(); },
    start: function () { startTask(); },
    work: function () { backToWork(); },
    free: function () { startFree(); },
    families: function () { screenFamilies(); },
    attach: function () { screenAttach(); },
    attachPick: function (d) { var b = U.block; if (b && !b.sid && student(d.id)) { b.sid = d.id; U.sid = d.id; S.blocks.push(b); save(); } screenFamilies(); },
    ctxPick: function (d) {
      var b = U.block, k = U.askKey, pend = U.pending; U.pending = null;
      if (!b || !k) return;
      b[k] = d.id; if (U.task && !U.task[k]) U.task[k] = d.id; save();
      if (pend && pend.line) setLine(pend.line); else if (pend && pend.family) pickFamily(pend.family);
    },
    place: function (d) { S.settings.place = d.id; save(); screenTask(); },
    checkToggle: function (d, el) { var on = el.className.indexOf(" sel") < 0; el.className = "choice" + (on ? " sel" : ""); el.setAttribute("aria-pressed", String(on)); },
    checkOk: function () { U.task.checked = document.querySelectorAll(".choice.sel").length; U.checkDone = true; save(); finishAs("terminee"); },
    sugOk: function (d) { var st = student(U.teacherSid); if (st) { st.methods[d.id] = parseInt(d.to, 10); st.msince[d.id] = now(); save(); } openTeacher(); },
    sugNo: function (d) { var st = student(U.teacherSid); if (st) { st.mdismiss[d.id] = now(); save(); } openTeacher(); },
    nextStep: function () { U.step++; renderTry(); },
    viewMethod: function (d) { screenViewMethod(d.id); },
    planToggle: function (d, el) {
      var i = draftPlan.indexOf(d.id);
      if (i >= 0) draftPlan.splice(i, 1); else draftPlan.push(d.id);
      el.className = "choice" + (i >= 0 ? "" : " sel"); el.setAttribute("aria-pressed", String(i < 0));
    },
    planGo: function (d) { U.task.plan = d.skip ? [] : draftPlan.slice(); U.task.start = now(); save(); screenWork(); },
    planEval: function (d) { U.task.planHelped = parseFloat(d.r); save(); finishHelped(); },
    passe: function () { endBlock("passe"); backToWork("C’est noté. On en reparlera."); },
    blocked: function () { blocked(); },
    family: function (d) { pickFamily(d.id); },
    unfold: function () { U.block.unfolded = true; save(); askQuestion(U.block.family); },
    pickCard: function (d) { proposeCardChosen(d.id); },
    answer: function (d) { answer(parseInt(d.i, 10)); },
    try: function () { startTry(); },
    other: function () { var a = alternatives(U.block, U.cardId); if (a.length) proposeCard(a[0], "choisie"); },
    tried: function () { tried(); },
    result: function (d) { result(parseFloat(d.r)); },
    "switch": function () { askQuestion(U.block.switched); },
    cancelBlock: function () { if (U.block && !U.block.end) { if (U.block.tries.length) endBlock("abandon"); else endBlock("annule"); } backToWork(); },
    helped: function () { endBlock("aide"); backToWork("C’est reparti."); },
    stopClean: function () { endBlock("stop"); finishAs("reportee"); },
    finish: function () { screenFinish(); },
    finishAs: function (d) {
      var st = student(U.sid);
      if (d.s === "terminee" && st && st.check && !U.checkDone) return screenCheck();
      finishAs(d.s);
    },
    helpedMost: function (d) { helpedMost(d.id); },
    plan: function (d) { var st = student(U.sid); if (st.pinned.indexOf(d.id) < 0) togglePin(st, d.id); screenBye(); },
    bye: function () { screenBye(); },
    notebook: function () { screenNotebook(); },
    backFromNotebook: function () { pickStudent(U.sid); },
    pin: function (d) { togglePin(student(U.sid), d.id); screenNotebook(); },
    unlock: function () {
      var el = document.getElementById("pin");
      if (el && el.value === S.settings.pin) { U.unlocked = true; openTeacher(); }
      else { var er = document.getElementById("pinerr"); if (er) er.hidden = false; }
    },
    tab: function (d) { U.teacherTab = d.id; openTeacher(); },
    avatar: function (d) { var n = document.getElementById("newName"), v = n ? n.value : ""; newAvatar = d.id; openTeacher(); n = document.getElementById("newName"); if (n) n.value = v; },
    addStudent: function () {
      var n = document.getElementById("newName"), name = n ? n.value.trim() : "";
      if (!name) { if (n) n.focus(); return; }
      S.students.push({ id: uid("s"), name: name, icon: newAvatar, levels: {}, lock: {}, since: {}, pinned: [], methods: {}, msince: {}, mdismiss: {}, plan: false, check: false });
      newAvatar = AVATARS[S.students.length % AVATARS.length];
      save(); openTeacher();
    },
    delStudent: function (d, el) {
      /* suppression en deux temps, sans boîte de dialogue du navigateur */
      if (el.getAttribute("data-sure") !== "1") { el.setAttribute("data-sure", "1"); el.textContent = "Confirmer la suppression (données comprises)"; return; }
      S.students = S.students.filter(function (s) { return s.id !== d.id; });
      S.tasks = S.tasks.filter(function (t) { return t.sid !== d.id; });
      S.blocks = S.blocks.filter(function (b) { return b.sid !== d.id; });
      save(); openTeacher();
    },
    savePin: function () { var el = document.getElementById("newPin"); S.settings.pin = el ? el.value.replace(/\D/g, "") : ""; save(); openTeacher(); },
    resetLabels: function (d, el) {
      if (el.getAttribute("data-sure") !== "1") { el.setAttribute("data-sure", "1"); el.textContent = "Confirmer : rétablir tous les textes"; return; }
      S.labels = { families: {}, lines: {}, cards: {} }; save(); openTeacher();
    },
    exportJson: function () { download("pl-restart-sauvegarde-" + stamp() + ".json", JSON.stringify(S, null, 2), "application/json"); },
    exportCsv: function () { download("pl-restart-essais-" + stamp() + ".csv", csv(), "text/csv;charset=utf-8"); },
    wipe: function () {
      var el = document.getElementById("wipeWord");
      if (!el || el.value.trim() !== "EFFACER") { if (el) el.focus(); return; }
      S = fresh(); save(); U.teacherSid = null; openTeacher();
    }
  };
  function proposeCardChosen(id) {
    var b = U.block; b.line = "libre"; save();
    U.cardId = id; U.origin = "choisie"; U.peek = false;
    U.mode = methodState(id, b.sid) || 1;
    startTry();
  }
  /* « Voir la carte » ouvert par un élève réglé sur « Seul » : noté avec l'essai (l'événement toggle ne remonte pas, d'où la capture) */
  document.addEventListener("toggle", function (e) {
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute("data-peek") && el.open) U.peek = true;
  }, true);
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-a]") : null;
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute("data-a")];
    if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  /* champs de l'espace enseignante : enregistrés à la modification, sans reconstruire l'écran (le focus reste en place) */
  var CHANGES = {
    teacherSid: function (el) { U.teacherSid = el.value; openTeacher(); },
    teacherNote: function (el) { var b = byId(S.blocks, el.dataset.id); if (b) { b.teacher = b.teacher || {}; b.teacher[el.dataset.f] = el.value; save(); } },
    level: function (el) { var st = student(el.dataset.id); if (st) { st.levels[el.dataset.f] = parseInt(el.value, 10); st.since[el.dataset.f] = now(); save(); } },
    lock: function (el) { var st = student(el.dataset.id); if (st) { st.lock[el.dataset.f] = el.checked; save(); } },
    setting: function (el) { S.settings[el.dataset.f] = el.checked; save(); },
    planOn: function (el) { var st = student(el.dataset.id); if (st) { st.plan = el.checked; save(); } },
    checkOn: function (el) { var st = student(el.dataset.id); if (st) { st.check = el.checked; save(); } },
    methodState: function (el) { var st = student(el.dataset.id); if (st) { st.methods[el.dataset.m] = parseInt(el.value, 10) || 0; st.msince[el.dataset.m] = now(); save(); } },
    methodDom: function (el) {
      var st = student(el.dataset.id), dom = el.dataset.d, v = parseInt(el.value, 10) || 0, t = now();
      if (!st || el.value === "") return;
      strategyIds().forEach(function (id) { var c = card(id); if (c && c.dom === dom) { st.methods[id] = v; st.msince[id] = t; } });
      save(); U.openBox = st.id; openTeacher();
    },
    famLabel: function (el) { setLabel("families", el.dataset.id, "label", el.value); },
    lineLabel: function (el) { setLabel("lines", el.dataset.id, "label", el.value); },
    cardTitle: function (el) { setLabel("cards", el.dataset.id, "title", el.value); },
    cardText: function (el) { setLabel("cards", el.dataset.id, "text", el.value); },
    cardMin: function (el) { var n = parseInt(el.value, 10); setLabel("cards", el.dataset.id, "min", n > 0 && n <= 30 ? n : 0); },
    cardActive: function (el) { setLabel("cards", el.dataset.id, "active", el.checked); }
  };
  function setLabel(group, id, field, value) {
    var o = S.labels[group][id] || (S.labels[group][id] = {});
    if (typeof value === "string") value = value.trim();
    if (value === "" || value === 0) delete o[field]; else o[field] = value;
    save();
  }
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "importFile") return importFile(el);
    var fn = el.getAttribute && CHANGES[el.getAttribute("data-c")];
    if (fn) fn(el);
  });
  function importFile(el) {
    var f = el.files && el.files[0], msg = document.getElementById("importMsg");
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(String(r.result));
        if (!data || data.version !== 1 || !Array.isArray(data.students)) throw new Error("format");
        S = normalize(data); save(); U.teacherSid = null; U.teacherTab = "suivi"; openTeacher();
      } catch (err) { if (msg) { msg.hidden = false; msg.textContent = "Ce fichier n’est pas une sauvegarde PL-restart’ valide."; } }
    };
    r.readAsText(f);
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "pin") ACTIONS.unlock();
    if (e.key === "Enter" && e.target && e.target.id === "newName") ACTIONS.addStudent();
  });

  /* hors ligne : uniquement sur un vrai serveur (GitHub Pages), pas en file:// */
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}

  goHome();
}
boot();
</script></body></html>
